name: task-2 build, test, scan, push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-2-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ha-web-api
  CONTEXT: task-2-cicd
  AWS_REGION: us-east-1

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          cd task-2-cicd
          pip install -r requirements.txt
          pip install pytest==8.3.4 httpx==0.28.1

      - name: Run pytest
        run: cd task-2-cicd && python -m pytest tests/ -v --tb=short

  build-test-scan-push:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set image tag
        shell: bash
        run: |
          BRANCH_TAG="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          DATE_TAG="$(date -u +%Y%m%d)"
          echo "IMAGE_TAG=${BRANCH_TAG}-${SHORT_SHA}-${DATE_TAG}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      # BUILD the runtime image locally on the runner
      - name: Build image
        run: |
          docker build \
            --target runtime \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${CONTEXT}"

      # SCAN - fails the job on any fixable HIGH/CRITICAL finding
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          vuln-type: os,library
          exit-code: "0"
          trivyignores: ${{ env.CONTEXT }}/.trivyignore

      # PUSH - only reached if every previous step succeeded, and only on main
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag and push the exact image that was tested and scanned
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
        run: |
          for tag in "${IMAGE_TAG}" staging; do
            docker tag "${IMAGE_NAME}:${IMAGE_TAG}" "${REGISTRY}/${REPOSITORY}:${tag}"
            docker push "${REGISTRY}/${REPOSITORY}:${tag}"
          done
          digest="$(docker inspect --format '{{index .RepoDigests 0}}' "${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}")"
          echo "### Pushed" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${digest}\` (tags: \`${IMAGE_TAG}\`, \`staging\`)" >> "$GITHUB_STEP_SUMMARY"