name: task-2 build, test, scan, push

on:
  push:
    branches: [main]
  pull_request:          # PRs run build/test/scan but never push
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: task-2-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ha-web-api
  CONTEXT: task-2-cicd

jobs:
  test:
    name: Run unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          cd task-2-cicd
          pip install -r requirements.txt
          pip install pytest==8.3.4 httpx==0.28.1
      - name: Run pytest
        run: cd task-2-cicd && python -m pytest tests/ -v --tb=short

  build-test-scan-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      # 1. BUILD the (runtime) image locally on the runner
      - name: Build image
        run: |
          docker build \
            --target runtime \
            --build-arg GIT_SHA="${GITHUB_SHA}" \
            -t "${IMAGE_NAME}:${GITHUB_SHA}" \
            "${CONTEXT}"

      # # 2. TEST - the `test` stage runs the unit tests; a failure fails the job.
      # #    --no-cache-filter forces the tests to really execute every run.
      # - name: Run unit tests
      #   run: |
      #     docker build \
      #       --target test \
      #       --no-cache-filter test \
      #       --progress=plain \
      #       "${CONTEXT}"

      # - name: Verify image runs as non-root and serves /health
      #   run: |
      #     uid="$(docker run --rm --entrypoint id "${IMAGE_NAME}:${GITHUB_SHA}" -u)"
      #     test "$uid" != "0" || { echo "::error::image runs as root"; exit 1; }
      #     cid="$(docker run -d -p 8080:8080 "${IMAGE_NAME}:${GITHUB_SHA}")"
      #     for i in $(seq 1 15); do
      #       curl -fsS http://127.0.0.1:8080/health && break || sleep 1
      #     done
      #     curl -fsS http://127.0.0.1:8080/health
      #     docker rm -f "$cid"

      # 3. SCAN - fails the job (exit-code 1) on any fixable HIGH/CRITICAL finding
      - name: Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true      # only block on vulns that have a fix available
          vuln-type: os,library
          exit-code: "1"
          trivyignores: ${{ env.CONTEXT }}/.trivyignore

